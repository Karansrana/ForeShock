<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeShock | Catastrophe Command Center</title>

    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map { height: calc(100vh - 64px); }
        .leaflet-container { background: #1a1a1a; }
        /* Dark-mode trick: invert OSM tiles so we get a dark theme with no API key */
        .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
        .alert-hover-tooltip {
            background: rgba(24, 24, 27, 0.96);
            border: 1px solid #52525b;
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }
        .alert-hover-tooltip::before { border-top-color: #52525b; }
    </style>
</head>
<body class="bg-zinc-900 text-white overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="h-16 bg-zinc-800 border-b border-zinc-700 flex items-center justify-between px-6 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-tight">ForeShock <span class="text-zinc-500 font-medium text-sm ml-2">Live Triage Hub</span></h1>
        </div>
        <div id="stats" class="flex gap-6 text-sm font-mono">
            <div>Alerts: <span id="alert-count" class="text-red-400">0</span></div>
            <div>Map: <span id="tile-provider" class="text-zinc-400">loading…</span></div>
            <div>Status: <span id="connection-status" class="text-green-400">Connected</span></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative">
        <div id="map"></div>

        <!-- SMS Triage Simulator (Phase 2): type a messy SOS, the AI turns it into a pin -->
        <div class="absolute top-4 left-4 z-[1000] bg-zinc-800/90 backdrop-blur-md border border-zinc-700 p-4 rounded-xl shadow-2xl w-80">
            <h2 class="text-xs font-semibold text-zinc-400 uppercase mb-2">Simulate an SMS SOS</h2>
            <textarea id="sms-input" rows="2" class="w-full bg-zinc-900 border border-zinc-600 rounded-lg p-2 text-sm placeholder-zinc-500 focus:outline-none focus:border-red-500" placeholder="e.g., Roof collapsed at 123 Main St, my dad needs insulin!"></textarea>
            <div class="flex gap-2 mt-2">
                <button id="send-sms" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold py-2 rounded-lg transition">Send SOS</button>
                <button id="example-sms" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-300 text-sm py-2 px-3 rounded-lg transition">Example</button>
            </div>
            <p id="sms-status" class="text-xs mt-2 text-zinc-400"></p>
        </div>

        <!-- Overlay Info Card -->
        <div class="absolute top-4 right-4 z-[1000] bg-zinc-800/90 backdrop-blur-md border border-zinc-700 p-4 rounded-xl shadow-2xl w-64 pointer-events-none">
            <h2 class="text-xs font-semibold text-zinc-400 uppercase mb-2">Triage Legend</h2>
            <div class="space-y-2 text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-red-600 rounded-full"></span>
                    <span>Medical / Critical (10)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-orange-500 rounded-full"></span>
                    <span>Trapped / Urgent (7)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                    <span>Supplies / Stable (4)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                    <span>Safe / Clear (0)</span>
                </div>
                <div class="pt-1">
                    <div class="text-xs text-zinc-400 mb-1">Impact area: lower → higher urgency</div>
                    <div class="h-2 rounded-full bg-gradient-to-r from-red-300 to-red-900"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Map (Centered on UTD Campus)
        const map = L.map('map').setView([32.985, -96.750], 14);

        // 2. Tile providers with automatic fallback.
        // Some networks (campus Wi-Fi, filters, shields) block certain tile domains,
        // so we try providers in order until one loads.
        const TILE_PROVIDERS = [
            {
                name: 'OpenStreetMap',
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }
            },
            {
                name: 'CARTO',
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                options: { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 20 }
            },
            {
                name: 'Esri',
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
                options: { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
            }
        ];

        let providerIndex = 0;
        let tileLayer = null;
        let tileErrors = 0;

        function installTileLayer() {
            const p = TILE_PROVIDERS[providerIndex];
            if (tileLayer) map.removeLayer(tileLayer);
            tileErrors = 0;
            tileLayer = L.tileLayer(p.url, p.options);
            tileLayer.on('tileerror', () => {
                tileErrors++;
                if (tileErrors >= 5 && providerIndex < TILE_PROVIDERS.length - 1) {
                    providerIndex++;
                    console.warn('Tiles blocked — switching provider to:', TILE_PROVIDERS[providerIndex].name);
                    installTileLayer();
                }
            });
            tileLayer.addTo(map);
            document.getElementById('tile-provider').innerText = p.name;
        }
        installTileLayer();

        const markers = [];
        const API_URL = 'http://localhost:8000/api/alerts';
        const coverageCanvas = document.createElement('canvas');
        const coverageContext = coverageCanvas.getContext('2d');
        const COVERAGE_RADIUS_METERS = 350;
        const COVERAGE_MAX_RADIUS = 130;
        const COVERAGE_SCALE = 0.5;
        coverageCanvas.style.pointerEvents = 'none';
        map.getPanes().overlayPane.appendChild(coverageCanvas);

        function renderCoverage(alerts) {
            const mapSize = map.getSize();
            const width = Math.max(1, Math.ceil(mapSize.x * COVERAGE_SCALE));
            const height = Math.max(1, Math.ceil(mapSize.y * COVERAGE_SCALE));
            L.DomUtil.setPosition(coverageCanvas, map.containerPointToLayerPoint([0, 0]));
            coverageCanvas.width = width;
            coverageCanvas.height = height;
            coverageCanvas.style.width = `${mapSize.x}px`;
            coverageCanvas.style.height = `${mapSize.y}px`;

            const zones = alerts.flatMap(alert => {
                const lat = Number(alert.lat);
                const lon = Number(alert.lon);
                const urgency = Number(alert.urgency);
                if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(urgency)) return [];

                const position = map.latLngToContainerPoint([lat, lon]);
                const metersPerPixel = map.distance(
                    [lat, lon],
                    map.containerPointToLatLng(L.point(position.x + 1, position.y))
                );
                const radius = Math.min(
                    COVERAGE_MAX_RADIUS,
                    Math.max(45, COVERAGE_RADIUS_METERS / (metersPerPixel || 1))
                ) * COVERAGE_SCALE;
                return [{ x: position.x * COVERAGE_SCALE, y: position.y * COVERAGE_SCALE, radius, urgency: Math.max(0, Math.min(10, urgency)) }];
            });

            if (zones.length === 0) return;

            const left = Math.max(0, Math.floor(Math.min(...zones.map(zone => zone.x - zone.radius))));
            const top = Math.max(0, Math.floor(Math.min(...zones.map(zone => zone.y - zone.radius))));
            const right = Math.min(width, Math.ceil(Math.max(...zones.map(zone => zone.x + zone.radius))));
            const bottom = Math.min(height, Math.ceil(Math.max(...zones.map(zone => zone.y + zone.radius))));
            if (right <= left || bottom <= top) return;

            const regionWidth = right - left;
            const regionHeight = bottom - top;
            const pixelCount = regionWidth * regionHeight;
            const influence = new Float32Array(pixelCount);
            const weightedUrgency = new Float32Array(pixelCount);

            zones.forEach(zone => {
                const minX = Math.max(left, Math.floor(zone.x - zone.radius));
                const maxX = Math.min(right, Math.ceil(zone.x + zone.radius));
                const minY = Math.max(top, Math.floor(zone.y - zone.radius));
                const maxY = Math.min(bottom, Math.ceil(zone.y + zone.radius));
                const radiusSquared = zone.radius * zone.radius;

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        const dx = x - zone.x;
                        const dy = y - zone.y;
                        const distanceSquared = dx * dx + dy * dy;
                        if (distanceSquared >= radiusSquared) continue;

                        const distance = Math.sqrt(distanceSquared / radiusSquared);
                        const remaining = 1 - distance;
                        const weight = remaining * remaining * (1 + 2 * distance);
                        const index = (y - top) * regionWidth + x - left;
                        influence[index] += weight;
                        weightedUrgency[index] += weight * zone.urgency;
                    }
                }
            });

            const image = coverageContext.createImageData(regionWidth, regionHeight);
            const lowSeverity = [252, 165, 165];
            const highSeverity = [127, 29, 29];
            for (let index = 0; index < pixelCount; index++) {
                const totalInfluence = influence[index];
                if (totalInfluence === 0) continue;

                const severity = weightedUrgency[index] / totalInfluence / 10;
                const colorOffset = index * 4;
                for (let channel = 0; channel < 3; channel++) {
                    image.data[colorOffset + channel] = Math.round(
                        lowSeverity[channel] + (highSeverity[channel] - lowSeverity[channel]) * severity
                    );
                }
                image.data[colorOffset + 3] = Math.round(255 * 0.55 * (1 - Math.exp(-totalInfluence * 0.9)));
            }
            coverageContext.putImageData(image, left, top);
        }

        map.on('moveend zoomend resize', () => renderCoverage(currentAlerts));
        let currentAlerts = [];

        // 3. Function to determine marker color based on urgency
        function getMarkerColor(urgency) {
            if (urgency >= 8) return 'red';
            if (urgency >= 5) return 'orange';
            if (urgency >= 2) return 'blue';
            return 'green';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        // 4. Marker hover shows a quick summary; click opens the full alert details.
        function createCustomMarker(lat, lon, color, alert) {
            const label = alert.urgency >= 8 ? 'CRITICAL' : alert.urgency >= 5 ? 'URGENT' : alert.urgency >= 2 ? 'STABLE' : 'SAFE';
            const source = alert.source === 'TEXT' ? '📱 SMS' : '🔘 Beacon';
            const type = escapeHtml(alert.type);
            const safeSource = escapeHtml(source);
            const urgency = escapeHtml(alert.urgency);
            const safeLabel = escapeHtml(label);
            const summary = escapeHtml(alert.summary || 'No summary provided.');
            const quickView = `<b>${type} Alert</b> <span style="opacity:.7">${safeSource}</span><br>Urgency: ${urgency}/10 — ${safeLabel}<br><span style="opacity:.8">${summary}</span>`;
            const details = `
                <div style="min-width:190px">
                    <div style="font-size:15px;font-weight:700;margin-bottom:8px">${type} Alert</div>
                    <div><b>Priority:</b> ${safeLabel} (${urgency}/10)</div>
                    <div><b>Reported via:</b> ${safeSource}</div>
                    <div style="margin-top:8px"><b>Summary</b><br>${summary}</div>
                    <div style="margin-top:8px;font-size:12px;opacity:.7"><b>Coordinates:</b> ${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)}</div>
                </div>`;
            const marker = L.circleMarker([lat, lon], {
                radius: 8,
                fillColor: color,
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            })
                .bindTooltip(quickView, {
                    className: 'alert-hover-tooltip',
                    direction: 'top',
                    offset: L.point(0, -8),
                    opacity: 0.98
                })
                .bindPopup(details);
            marker.on('click', () => marker.closeTooltip());
            return marker;
        }

        // 5. The Polling Loop: Fetch alerts from Backend every 2 seconds
        async function fetchAlerts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                currentAlerts = data;
                renderCoverage(data);

                document.getElementById('alert-count').innerText = data.length;
                document.getElementById('connection-status').innerText = 'Connected';
                document.getElementById('connection-status').className = 'text-green-400';

                // Clear existing markers to prevent duplicates
                markers.forEach(m => map.removeLayer(m));
                markers.length = 0;

                // Add new markers based on data
                data.forEach(alert => {
                    const color = getMarkerColor(alert.urgency);
                    const marker = createCustomMarker(alert.lat, alert.lon, color, alert);
                    marker.addTo(map);
                    markers.push(marker);
                });

            } catch (error) {
                console.error('Error fetching alerts:', error);
                document.getElementById('connection-status').innerText = 'Disconnected';
                document.getElementById('connection-status').className = 'text-red-400';
            }
        }

        // 6. SMS Triage Simulator: send a messy text through the AI pipeline
        const EXAMPLES = [
            "Tree fell on my roof at 1100 Campbell Rd, my dad is bleeding badly, need an ambulance!!",
            "Water is rising fast in my attic on Sherwood Dr, 3 of us trapped, please hurry",
            "We are okay but completely out of water and baby formula, 2200 Waterview Pkwy",
            "Everyone is safe here, house barely damaged, just no power",
        ];
        let exampleIndex = 0;

        function getRandomVisibleMapCoords() {
            const size = map.getSize();
            const padding = 24;
            const minX = Math.min(padding, size.x / 2);
            const minY = Math.min(padding, size.y / 2);
            const point = L.point(
                minX + Math.random() * (size.x - 2 * minX),
                minY + Math.random() * (size.y - 2 * minY)
            );
            const coords = map.containerPointToLatLng(point);
            return { lat: coords.lat, lon: coords.lng };
        }

        async function submitTextAlert() {
            const input = document.getElementById('sms-input');
            const status = document.getElementById('sms-status');
            const text = input.value.trim();
            if (!text) { status.textContent = 'Type a message first.'; status.className = 'text-xs mt-2 text-zinc-400'; return; }

            const demoCoords = getRandomVisibleMapCoords();
            status.textContent = 'AI triaging…';
            status.className = 'text-xs mt-2 text-yellow-400';
            try {
                const res = await fetch('http://localhost:8000/api/text-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, demo_coords: demoCoords })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Backend error');
                }
                const alert = await res.json();
                status.textContent = `✅ Parsed as ${alert.type} (urgency ${alert.urgency}) — pin incoming`;
                status.className = 'text-xs mt-2 text-green-400';
                input.value = '';
                fetchAlerts(); // refresh the map immediately
            } catch (e) {
                status.textContent = `❌ ${e.message}`;
                status.className = 'text-xs mt-2 text-red-400';
            }
        }

        document.getElementById('send-sms').addEventListener('click', submitTextAlert);
        document.getElementById('sms-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitTextAlert(); }
        });
        document.getElementById('example-sms').addEventListener('click', () => {
            document.getElementById('sms-input').value = EXAMPLES[exampleIndex % EXAMPLES.length];
            exampleIndex++;
        });

        // Start the loop
        setInterval(fetchAlerts, 2000);
        fetchAlerts(); // Initial call
    </script>
</body>
</html>
