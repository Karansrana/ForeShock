<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeShock | Catastrophe Command Center</title>

    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map { height: calc(100vh - 64px); }
        .leaflet-container { background: #1a1a1a; }
        /* Dark-mode trick: invert OSM tiles so we get a dark theme with no API key */
        .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
    </style>
</head>
<body class="bg-zinc-900 text-white overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="h-16 bg-zinc-800 border-b border-zinc-700 flex items-center justify-between px-6 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-tight">ForeShock <span class="text-zinc-500 font-medium text-sm ml-2">Live Triage Hub</span></h1>
        </div>
        <div id="stats" class="flex gap-6 text-sm font-mono">
            <div>Alerts: <span id="alert-count" class="text-red-400">0</span></div>
            <div>Map: <span id="tile-provider" class="text-zinc-400">loading…</span></div>
            <div>Status: <span id="connection-status" class="text-green-400">Connected</span></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative">
        <div id="map"></div>

        <!-- SMS Triage Simulator (Phase 2): type a messy SOS, the AI turns it into a pin -->
        <div class="absolute top-4 left-4 z-[1000] bg-zinc-800/90 backdrop-blur-md border border-zinc-700 p-4 rounded-xl shadow-2xl w-80">
            <h2 class="text-xs font-semibold text-zinc-400 uppercase mb-2">Simulate an SMS SOS</h2>
            <textarea id="sms-input" rows="2" class="w-full bg-zinc-900 border border-zinc-600 rounded-lg p-2 text-sm placeholder-zinc-500 focus:outline-none focus:border-red-500" placeholder="e.g., Roof collapsed at 123 Main St, my dad needs insulin!"></textarea>
            <div class="flex gap-2 mt-2">
                <button id="send-sms" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold py-2 rounded-lg transition">Send SOS</button>
                <button id="example-sms" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-300 text-sm py-2 px-3 rounded-lg transition">Example</button>
            </div>
            <p id="sms-status" class="text-xs mt-2 text-zinc-400"></p>
        </div>

        <!-- Overlay Info Card -->
        <div class="absolute top-4 right-4 z-[1000] bg-zinc-800/90 backdrop-blur-md border border-zinc-700 p-4 rounded-xl shadow-2xl w-64 pointer-events-none">
            <h2 class="text-xs font-semibold text-zinc-400 uppercase mb-2">Triage Legend</h2>
            <div class="space-y-2 text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-red-600 rounded-full"></span>
                    <span>Medical / Critical (10)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-orange-500 rounded-full"></span>
                    <span>Trapped / Urgent (7)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                    <span>Supplies / Stable (4)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                    <span>Safe / Clear (0)</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Map (Centered on UTD Campus)
        const map = L.map('map').setView([32.985, -96.750], 14);

        // 2. Tile providers with automatic fallback.
        // Some networks (campus Wi-Fi, filters, shields) block certain tile domains,
        // so we try providers in order until one loads.
        const TILE_PROVIDERS = [
            {
                name: 'OpenStreetMap',
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }
            },
            {
                name: 'CARTO',
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                options: { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 20 }
            },
            {
                name: 'Esri',
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
                options: { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
            }
        ];

        let providerIndex = 0;
        let tileLayer = null;
        let tileErrors = 0;

        function installTileLayer() {
            const p = TILE_PROVIDERS[providerIndex];
            if (tileLayer) map.removeLayer(tileLayer);
            tileErrors = 0;
            tileLayer = L.tileLayer(p.url, p.options);
            tileLayer.on('tileerror', () => {
                tileErrors++;
                if (tileErrors >= 5 && providerIndex < TILE_PROVIDERS.length - 1) {
                    providerIndex++;
                    console.warn('Tiles blocked — switching provider to:', TILE_PROVIDERS[providerIndex].name);
                    installTileLayer();
                }
            });
            tileLayer.addTo(map);
            document.getElementById('tile-provider').innerText = p.name;
        }
        installTileLayer();

        const markers = [];
        const API_URL = 'http://localhost:8000/api/alerts';

        // 3. Function to determine marker color based on urgency
        function getMarkerColor(urgency) {
            if (urgency >= 8) return 'red';
            if (urgency >= 5) return 'orange';
            if (urgency >= 2) return 'blue';
            return 'green';
        }

        // 4. Function to create a colored circle marker (popup shows AI summary + source)
        function createCustomMarker(lat, lon, color, alert) {
            const label = alert.urgency >= 8 ? 'CRITICAL' : alert.urgency >= 5 ? 'URGENT' : alert.urgency >= 2 ? 'STABLE' : 'SAFE';
            const source = alert.source === 'TEXT' ? '📱 SMS' : '🔘 Beacon';
            const summary = alert.summary ? `<br><span style="opacity:.75">${alert.summary}</span>` : '';
            return L.circleMarker([lat, lon], {
                radius: 8,
                fillColor: color,
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }).bindPopup(`<b>${alert.type} Alert</b> <span style="opacity:.6">${source}</span><br>Urgency: ${alert.urgency}/10 — ${label}${summary}`);
        }

        function getMarkerPosition(alert) {
            const position = L.latLng(alert.lat, alert.lon);
            if (alert.source !== 'TEXT') return position;

            const size = map.getSize();
            const point = map.latLngToContainerPoint(position);
            const padding = 24;
            const minX = Math.min(padding, size.x / 2);
            const minY = Math.min(padding, size.y / 2);
            const visiblePoint = L.point(
                Math.max(minX, Math.min(size.x - minX, point.x)),
                Math.max(minY, Math.min(size.y - minY, point.y))
            );
            return map.containerPointToLatLng(visiblePoint);
        }

        // 5. The Polling Loop: Fetch alerts from Backend every 2 seconds
        async function fetchAlerts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                document.getElementById('alert-count').innerText = data.length;
                document.getElementById('connection-status').innerText = 'Connected';
                document.getElementById('connection-status').className = 'text-green-400';

                // Clear existing markers to prevent duplicates
                markers.forEach(m => map.removeLayer(m));
                markers.length = 0;

                // Add new markers based on data
                data.forEach(alert => {
                    const color = getMarkerColor(alert.urgency);
                    const position = getMarkerPosition(alert);
                    const marker = createCustomMarker(position.lat, position.lng, color, alert);
                    marker.addTo(map);
                    markers.push(marker);
                });

            } catch (error) {
                console.error('Error fetching alerts:', error);
                document.getElementById('connection-status').innerText = 'Disconnected';
                document.getElementById('connection-status').className = 'text-red-400';
            }
        }

        // 6. SMS Triage Simulator: send a messy text through the AI pipeline
        const EXAMPLES = [
            "Tree fell on my roof at 1100 Campbell Rd, my dad is bleeding badly, need an ambulance!!",
            "Water is rising fast in my attic on Sherwood Dr, 3 of us trapped, please hurry",
            "We are okay but completely out of water and baby formula, 2200 Waterview Pkwy",
            "Everyone is safe here, house barely damaged, just no power",
        ];
        let exampleIndex = 0;

        async function submitTextAlert() {
            const input = document.getElementById('sms-input');
            const status = document.getElementById('sms-status');
            const text = input.value.trim();
            if (!text) { status.textContent = 'Type a message first.'; status.className = 'text-xs mt-2 text-zinc-400'; return; }

            status.textContent = 'AI triaging…';
            status.className = 'text-xs mt-2 text-yellow-400';
            try {
                const res = await fetch('http://localhost:8000/api/text-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Backend error');
                }
                const alert = await res.json();
                status.textContent = `✅ Parsed as ${alert.type} (urgency ${alert.urgency}) — pin incoming`;
                status.className = 'text-xs mt-2 text-green-400';
                input.value = '';
                fetchAlerts(); // refresh the map immediately
            } catch (e) {
                status.textContent = `❌ ${e.message}`;
                status.className = 'text-xs mt-2 text-red-400';
            }
        }

        document.getElementById('send-sms').addEventListener('click', submitTextAlert);
        document.getElementById('sms-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitTextAlert(); }
        });
        document.getElementById('example-sms').addEventListener('click', () => {
            document.getElementById('sms-input').value = EXAMPLES[exampleIndex % EXAMPLES.length];
            exampleIndex++;
        });

        // Start the loop
        setInterval(fetchAlerts, 2000);
        fetchAlerts(); // Initial call
    </script>
</body>
</html>
