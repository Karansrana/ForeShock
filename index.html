<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeShock | Catastrophe Command Center</title>

    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { margin: 0; background: #f3f3f3; color: #18181b; font-family: Arial, Helvetica, sans-serif; }
        #map { height: calc(100vh - 116px); }
        .leaflet-container { background: #1a1a1a; }
        /* Dark-mode trick: invert OSM tiles so we get a dark theme with no API key */
        .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
        .site-header {
            height: 82px;
            padding: 0 34px;
            background: #fff;
            color: #18181b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            position: relative;
            z-index: 1100;
        }
        .brand-lockup { display: flex; align-items: center; gap: 38px; min-width: max-content; }
        .brand-wordmark { display: flex; align-items: baseline; font-size: 30px; letter-spacing: -1.5px; line-height: 1; }
        .brand-wordmark strong { font-weight: 900; }
        .brand-wordmark em { color: #f0440a; font-family: Georgia, serif; font-size: 32px; font-weight: 500; }
        .brand-tagline { color: #687080; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
        .header-right { display: flex; align-items: center; gap: 34px; }
        .header-stats { display: flex; align-items: center; gap: 28px; }
        .header-stat { display: grid; gap: 4px; white-space: nowrap; }
        .header-stat-label { color: #c5cad3; font-size: 9px; font-weight: 900; letter-spacing: 1px; }
        .header-stat-value { color: #151927; font-size: 10px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
        #alert-count { color: #f0440a; font-size: 15px; letter-spacing: 1px; }
        #connection-status { color: #00a94f; font-size: 10px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
        #connection-status::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 6px 1px 0; border-radius: 50%; background: #00bd59; }
        .site-header #sms-menu > summary {
            min-width: 180px;
            list-style: none;
            padding: 15px 23px;
            border-radius: 18px;
            background: #f0440a;
            color: #fff;
            box-shadow: 0 7px 12px rgba(111, 44, 18, .16);
            cursor: pointer;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .5px;
            text-align: center;
            text-transform: uppercase;
        }
        .site-header #sms-menu > summary::-webkit-details-marker { display: none; }
        .site-header #sms-menu > summary:hover { background: #d93805; }
        .site-header #sms-menu[open] > summary { background: #d93805; }
        .clear-alerts-button {
            padding: 14px 16px;
            border: 1px solid #e4e4e7;
            border-radius: 16px;
            background: #fff;
            color: #71717a;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .4px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .clear-alerts-button:hover:not(:disabled) { border-color: #fca5a5; color: #dc2626; }
        .clear-alerts-button:disabled { cursor: not-allowed; opacity: .45; }
        .sms-menu-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: min(20rem, calc(100vw - 2rem));
            padding: 16px;
            border: 1px solid #e4e4e7;
            border-radius: 16px;
            background: rgba(255, 255, 255, .98);
            color: #18181b;
            box-shadow: 0 18px 40px rgba(24, 24, 27, .18);
        }
        .sms-menu-panel textarea { background: #fafafa; color: #18181b; }
        .sms-menu-panel h2 { color: #71717a; }
        .sms-menu-panel #example-sms { background: #e4e4e7; color: #3f3f46; }
        .map-legend {
            position: absolute;
            z-index: 900;
            left: 50%;
            width: min(880px, calc(100% - 32px));
            bottom: 22px;
            min-height: 76px;
            padding: 14px 22px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 26px;
            background: rgba(255,255,255,.97);
            box-shadow: 0 12px 26px rgba(24, 24, 27, .14);
            color: #19202f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(24px, 5vw, 64px);
            pointer-events: none;
            transform: translateX(-50%);
        }
        .legend-categories { display: flex; align-items: center; justify-content: space-between; gap: clamp(14px, 3.2vw, 38px); }
        .legend-item { display: flex; align-items: center; gap: 10px; color: #9299a8; font-size: 10px; font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
        .legend-item:first-child { color: #222938; }
        .legend-icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; }
        .legend-icon svg { width: 100%; height: 100%; }
        .legend-critical { color: #f0440a; }
        .legend-urgent { color: #ff9a54; }
        .legend-stable { color: #3b82f6; }
        .legend-safe { color: #00bd79; }
        .alert-div-icon { border: 0; background: transparent; }
        .alert-pin-shell {
            --pin-color: #f0440a;
            position: relative;
            display: flex;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--pin-color);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 3px 10px rgba(24, 24, 27, .3);
        }
        .alert-pin-shell::before {
            position: absolute;
            inset: -5px;
            border: 2px solid var(--pin-color);
            border-radius: 50%;
            content: "";
            animation: alert-pin-wave 2.4s ease-out infinite;
        }
        .alert-pin-icon { width: 18px; height: 18px; color: var(--pin-color); }
        .alert-pin-urgent { --pin-color: #ff9a54; }
        .alert-pin-stable { --pin-color: #3b82f6; }
        .alert-pin-safe { --pin-color: #00bd79; }
        @keyframes alert-pin-wave {
            0% { opacity: .35; transform: scale(.8); }
            75%, 100% { opacity: 0; transform: scale(1.35); }
        }
        @media (prefers-reduced-motion: reduce) {
            .alert-pin-shell::before { animation: none; }
        }
        .impact-scale { width: clamp(150px, 21vw, 218px); flex-shrink: 0; }
        .impact-title { margin-bottom: 10px; color: #c4c9d2; font-size: 10px; font-weight: 900; letter-spacing: 1px; text-align: center; }
        .impact-gradient { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #f3e7df, #ff9b53, #f0440a, #df1e24); }
        .impact-labels { display: flex; justify-content: space-between; margin-top: 9px; color: #c5cad3; font-size: 8px; font-weight: 900; text-transform: uppercase; }
        .site-footer {
            height: 34px;
            padding: 0 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #fff;
            color: #c2c8d1;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        @media (max-width: 850px) {
            .site-header { padding: 0 20px; }
            .brand-lockup { gap: 18px; }
            .header-right { gap: 18px; }
            .header-stats { gap: 16px; }
            .map-legend { padding: 14px 18px; gap: 24px; }
            .legend-categories { gap: 16px; }
        }
        @media (max-width: 640px) {
            #map { height: calc(100vh - 108px); }
            .site-header { height: 72px; padding: 0 14px; gap: 8px; }
            .brand-lockup { gap: 0; min-width: 0; }
            .brand-wordmark { font-size: 24px; }
            .brand-wordmark em { font-size: 26px; }
            .brand-tagline { display: none; }
            .header-right { gap: 10px; }
            .header-stats { gap: 10px; }
            .header-stat-label { font-size: 8px; }
            .header-stat-value { font-size: 8px; }
            .header-stat:nth-child(2) { display: none; }
            .header-stat:nth-child(3) { display: none; }
            .site-header #sms-menu > summary { min-width: 0; padding: 13px 12px; font-size: 9px; }
            .clear-alerts-button { padding: 12px 8px; font-size: 8px; }
            .map-legend { left: 12px; right: 12px; width: auto; bottom: 14px; min-height: 0; padding: 12px 10px; border-radius: 20px; gap: 12px; transform: none; }
            .legend-categories { flex: 1; flex-wrap: wrap; justify-content: center; gap: 12px 16px; }
            .legend-item { gap: 6px; font-size: 8px; letter-spacing: .6px; }
            .legend-icon { width: 13px; height: 13px; }
            .impact-scale { display: none; }
            .site-footer { height: 36px; padding: 0 12px; font-size: 7px; letter-spacing: .8px; }
            .site-footer span:nth-child(2) { display: none; }
        }
        @media (max-width: 360px) {
            .brand-wordmark { font-size: 20px; }
            .brand-wordmark em { font-size: 22px; }
            .header-right { gap: 6px; }
            .header-stats { display: none; }
            .clear-alerts-button { padding: 12px 8px; font-size: 0; }
            .clear-alerts-button::after { content: "RESET"; font-size: 8px; }
            .site-header #sms-menu > summary { padding: 13px 8px; font-size: 8px; }
        }
        .alert-hover-tooltip {
            background: rgba(24, 24, 27, 0.96);
            border: 1px solid #52525b;
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }
        .alert-hover-tooltip::before { border-top-color: #52525b; }
        .alert-marker-pulse {
            animation: alert-marker-pulse 2.4s ease-in-out infinite;
        }
        @keyframes alert-marker-pulse {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
            50% { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.75)); }
        }
        @media (prefers-reduced-motion: reduce) {
            .alert-marker-pulse { animation: none; }
        }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="site-header">
        <div class="brand-lockup">
            <h1 class="brand-wordmark"><strong>FORE</strong><em>shock</em></h1>
        </div>
        <div class="header-right">
            <div id="stats" class="header-stats">
                <div class="header-stat"><span class="header-stat-label">ALERTS</span><span id="alert-count" class="header-stat-value">0</span></div>
                <div class="header-stat"><span class="header-stat-label">MAP SOURCE</span><span id="tile-provider" class="header-stat-value">LOADING…</span></div>

    <!-- Main Content -->
    <main class="relative">
        <div id="map"></div>

        <div class="map-legend">
            <div class="legend-categories">
                <span class="legend-item">
                    <span class="legend-icon legend-critical"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/></svg></span>

                </span>
                <span class="legend-item">
                    <span class="legend-icon legend-urgent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span>
                    URGENT
                </span>
                <span class="legend-item">
                    <span class="legend-icon legend-stable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/></svg></span>
                    STABLE
                </span>
                <span class="legend-item">
                    <span class="legend-icon legend-safe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.1V12a8 8 0 1 1-4.7-7.3"/><path d="m8.5 11.5 3 3L22 4"/></svg></span>

    <footer class="site-footer">

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Map (Centered on UTD Campus)
        const map = L.map('map').setView([32.985, -96.750], 14);

        // 2. Tile providers with automatic fallback.
        // Some networks (campus Wi-Fi, filters, shields) block certain tile domains,
        // so we try providers in order until one loads.
        const TILE_PROVIDERS = [
            {
                name: 'OpenStreetMap',
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                options: { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }
            },
            {
                name: 'CARTO',
                url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                options: { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 20 }
            },
            {
                name: 'Esri',
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
                options: { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
            }
        ];

        let providerIndex = 0;
        let tileLayer = null;
        let tileErrors = 0;

        function installTileLayer() {
            const p = TILE_PROVIDERS[providerIndex];
            if (tileLayer) map.removeLayer(tileLayer);
            tileErrors = 0;
            tileLayer = L.tileLayer(p.url, p.options);
            tileLayer.on('tileerror', () => {
                tileErrors++;
                if (tileErrors >= 5 && providerIndex < TILE_PROVIDERS.length - 1) {
                    providerIndex++;
                    console.warn('Tiles blocked — switching provider to:', TILE_PROVIDERS[providerIndex].name);
                    installTileLayer();
                }
            });
            tileLayer.addTo(map);
            document.getElementById('tile-provider').innerText = p.name;
        }
        installTileLayer();

        const markers = [];
        const API_URL = '/api/alerts';
        const coverageCanvas = document.createElement('canvas');
        const coverageContext = coverageCanvas.getContext('2d');
        const COVERAGE_RADIUS_METERS = 350;
        const COVERAGE_MAX_RADIUS = 130;
        const COVERAGE_SCALE = 1;
        coverageCanvas.style.pointerEvents = 'none';
        map.getPanes().overlayPane.appendChild(coverageCanvas);

        function renderCoverage(alerts) {
            const mapSize = map.getSize();
            const width = Math.max(1, Math.ceil(mapSize.x * COVERAGE_SCALE));
            const height = Math.max(1, Math.ceil(mapSize.y * COVERAGE_SCALE));
            L.DomUtil.setPosition(coverageCanvas, map.containerPointToLayerPoint([0, 0]));
            coverageCanvas.width = width;
            coverageCanvas.height = height;
            coverageCanvas.style.width = `${mapSize.x}px`;
            coverageCanvas.style.height = `${mapSize.y}px`;

            const zones = alerts.flatMap(alert => {
                const lat = Number(alert.lat);
                const lon = Number(alert.lon);
                const urgency = Number(alert.urgency);
                if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(urgency)) return [];

                const position = map.latLngToContainerPoint([lat, lon]);
                const metersPerPixel = map.distance(
                    [lat, lon],
                    map.containerPointToLatLng(L.point(position.x + 1, position.y))
                );
                const radius = Math.min(
                    COVERAGE_MAX_RADIUS,
                    Math.max(45, COVERAGE_RADIUS_METERS / (metersPerPixel || 1))
                ) * COVERAGE_SCALE;
                return [{ x: position.x * COVERAGE_SCALE, y: position.y * COVERAGE_SCALE, radius, urgency: Math.max(0, Math.min(10, urgency)) }];
            });

            if (zones.length === 0) return;

            const left = Math.max(0, Math.floor(Math.min(...zones.map(zone => zone.x - zone.radius))));
            const top = Math.max(0, Math.floor(Math.min(...zones.map(zone => zone.y - zone.radius))));
            const right = Math.min(width, Math.ceil(Math.max(...zones.map(zone => zone.x + zone.radius))));
            const bottom = Math.min(height, Math.ceil(Math.max(...zones.map(zone => zone.y + zone.radius))));
            if (right <= left || bottom <= top) return;

            const regionWidth = right - left;
            const regionHeight = bottom - top;
            const pixelCount = regionWidth * regionHeight;
            const influence = new Float32Array(pixelCount);
            const weightedUrgency = new Float32Array(pixelCount);

            zones.forEach(zone => {
                const minX = Math.max(left, Math.floor(zone.x - zone.radius));
                const maxX = Math.min(right, Math.ceil(zone.x + zone.radius));
                const minY = Math.max(top, Math.floor(zone.y - zone.radius));
                const maxY = Math.min(bottom, Math.ceil(zone.y + zone.radius));
                const radiusSquared = zone.radius * zone.radius;

                for (let y = minY; y < maxY; y++) {
                    for (let x = minX; x < maxX; x++) {
                        const dx = x - zone.x;
                        const dy = y - zone.y;
                        const distanceSquared = dx * dx + dy * dy;
                        if (distanceSquared >= radiusSquared) continue;

                        const distance = Math.sqrt(distanceSquared / radiusSquared);
                        const remaining = 1 - distance;
                        const weight = remaining * remaining * (1 + 2 * distance);
                        const index = (y - top) * regionWidth + x - left;
                        influence[index] += weight;
                        weightedUrgency[index] += weight * zone.urgency;
                    }
                }
            });

            const image = coverageContext.createImageData(regionWidth, regionHeight);
            const lowSeverity = [252, 165, 165];
            const highSeverity = [127, 29, 29];
            for (let index = 0; index < pixelCount; index++) {
                const totalInfluence = influence[index];
                if (totalInfluence === 0) continue;

                const severity = weightedUrgency[index] / totalInfluence / 10;
                const colorOffset = index * 4;
                for (let channel = 0; channel < 3; channel++) {
                    image.data[colorOffset + channel] = Math.round(
                        lowSeverity[channel] + (highSeverity[channel] - lowSeverity[channel]) * severity
                    );
                }
                image.data[colorOffset + 3] = Math.round(255 * 0.76 * (1 - Math.exp(-totalInfluence * 1.1)));
            }
            coverageContext.putImageData(image, left, top);
        }

        map.on('moveend zoomend resize', () => renderCoverage(currentAlerts));
        let currentAlerts = [];

        // Keep marker shapes and colors aligned with the severity legend.
        function getMarkerSeverity(urgency, alertType) {
            if (String(alertType).toUpperCase() === 'TRAPPED') {
                return {
                    label: 'URGENT',
                    className: 'alert-pin-urgent',
                    icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'
                };
            }
            if (urgency >= 8) {
                return {
                    label: 'CRITICAL',
                    className: 'alert-pin-critical',
                    icon: '<path d="M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>'
                };
            }
            if (urgency >= 5) {
                return {
                    label: 'URGENT',
                    className: 'alert-pin-urgent',
                    icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'
                };
            }
            if (urgency >= 2) {
                return {
                    label: 'STABLE',
                    className: 'alert-pin-stable',
                    icon: '<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/>'
                };
            }
            return {
                label: 'SAFE',
                className: 'alert-pin-safe',
                icon: '<path d="M20 11.1V12a8 8 0 1 1-4.7-7.3"/><path d="m8.5 11.5 3 3L22 4"/>'
            };
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        // 4. Marker hover shows a quick summary; click opens the full alert details.
        function createCustomMarker(lat, lon, alert) {
            const severity = getMarkerSeverity(alert.urgency, alert.type);
            const source = alert.source === 'TEXT' ? '📱 SMS' : '🔘 Beacon';
            const type = escapeHtml(alert.type);
            const safeSource = escapeHtml(source);
            const urgency = escapeHtml(alert.urgency);
            const safeLabel = escapeHtml(severity.label);
            const summary = escapeHtml(alert.summary || 'No summary provided.');
            const reportedAt = alert.created_at ? new Date(alert.created_at) : null;
            const formattedTime = reportedAt && Number.isFinite(reportedAt.getTime())
                ? reportedAt.toLocaleString(undefined, {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    timeZoneName: 'short'
                })
                : 'Time unavailable';
            const safeReportedAt = escapeHtml(formattedTime);
            const quickView = `<b>${type} Alert</b> <span style="opacity:.7">${safeSource}</span><br>Urgency: ${urgency}/10 — ${safeLabel}<br>Reported: ${safeReportedAt}<br><span style="opacity:.8">${summary}</span>`;
            const details = `
                <div style="min-width:190px">
                    <div style="font-size:15px;font-weight:700;margin-bottom:8px">${type} Alert</div>
                    <div><b>Priority:</b> ${safeLabel} (${urgency}/10)</div>
                    <div><b>Reported via:</b> ${safeSource}</div>
                    <div><b>Reported at:</b> ${safeReportedAt}</div>
                    <div style="margin-top:8px"><b>Summary</b><br>${summary}</div>
                    <div style="margin-top:8px;font-size:12px;opacity:.7"><b>Coordinates:</b> ${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)}</div>
                </div>`;
            const icon = L.divIcon({
                className: 'alert-div-icon',
                html: `<span class="alert-pin-shell ${severity.className}" role="img" aria-label="${safeLabel} alert"><svg class="alert-pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${severity.icon}</svg></span>`,
                iconSize: [36, 36],
                iconAnchor: [18, 18],
                tooltipAnchor: [0, -20],
                popupAnchor: [0, -18]
            });
            const marker = L.marker([lat, lon], { icon, keyboard: true })
                .bindTooltip(quickView, {
                    className: 'alert-hover-tooltip',
                    direction: 'top',
                    offset: L.point(0, -8),
                    opacity: 0.98
                })
                .bindPopup(details);
            marker.on('click', () => marker.closeTooltip());
            return marker;
        }

        // 5. The Polling Loop: Fetch alerts from Backend every 2 seconds
        async function fetchAlerts() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`Alert API returned HTTP ${response.status}`);
                const data = await response.json();
                currentAlerts = data;
                renderCoverage(data);

                document.getElementById('alert-count').innerText = data.length;
                document.getElementById('clear-alerts').disabled = data.length === 0;
                document.getElementById('connection-status').innerText = 'Connected';
                document.getElementById('connection-status').className = 'text-green-400';

                // Clear existing markers to prevent duplicates
                markers.forEach(m => map.removeLayer(m));
                markers.length = 0;

                // Add new markers based on data
                data.forEach(alert => {
                    const marker = createCustomMarker(alert.lat, alert.lon, alert);
                    marker.addTo(map);
                    markers.push(marker);
                });

            } catch (error) {
                console.error('Error fetching alerts:', error);
                document.getElementById('connection-status').innerText = 'Disconnected';
                document.getElementById('connection-status').className = 'text-red-400';
            }
        }

        async function clearAlerts() {
            if (!window.confirm('Clear all alerts from the shared demo map for everyone? This cannot be undone.')) return;

            const button = document.getElementById('clear-alerts');
            button.disabled = true;
            try {
                const response = await fetch('/api/alerts', { method: 'DELETE' });
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.detail || `Clear request failed (HTTP ${response.status})`);
                }
                await fetchAlerts();
            } catch (error) {
                console.error('Error clearing alerts:', error);
                button.disabled = false;
                window.alert(`Could not clear alerts: ${error.message}`);
            }
        }

        // 6. SMS Triage Simulator: send a messy text through the AI pipeline
        const EXAMPLES = [
            "Tree fell on my roof at 1100 Campbell Rd, my dad is bleeding badly, need an ambulance!!",
            "Water is rising fast in my attic on Sherwood Dr, 3 of us trapped, please hurry",
            "We are okay but completely out of water and baby formula, 2200 Waterview Pkwy",
            "Everyone is safe here, house barely damaged, just no power",
        ];
        let exampleIndex = 0;

        function getRandomVisibleMapCoords() {
            const size = map.getSize();
            const padding = 24;
            const minX = Math.min(padding, size.x / 2);
            const minY = Math.min(padding, size.y / 2);
            const point = L.point(
                minX + Math.random() * (size.x - 2 * minX),
                minY + Math.random() * (size.y - 2 * minY)
            );
            const coords = map.containerPointToLatLng(point);
            return { lat: coords.lat, lon: coords.lng };
        }

        async function submitTextAlert() {
            const input = document.getElementById('sms-input');
            const status = document.getElementById('sms-status');
            const text = input.value.trim();
            if (!text) { status.textContent = 'Type a message first.'; status.className = 'text-xs mt-2 text-zinc-400'; return; }

            const demoCoords = getRandomVisibleMapCoords();
            status.textContent = 'AI triaging…';
            status.className = 'text-xs mt-2 text-yellow-400';
            try {
                const res = await fetch('/api/text-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, demo_coords: demoCoords })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Backend error');
                }
                const alert = await res.json();
                status.textContent = `✅ Parsed as ${alert.type} (urgency ${alert.urgency}) — pin incoming`;
                status.className = 'text-xs mt-2 text-green-400';
                input.value = '';
                fetchAlerts(); // refresh the map immediately
            } catch (e) {
                status.textContent = `❌ ${e.message}`;
                status.className = 'text-xs mt-2 text-red-400';
            }
        }

        document.getElementById('send-sms').addEventListener('click', submitTextAlert);
        document.getElementById('clear-alerts').addEventListener('click', clearAlerts);
        document.getElementById('sms-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitTextAlert(); }
        });
        document.getElementById('example-sms').addEventListener('click', () => {
            document.getElementById('sms-input').value = EXAMPLES[exampleIndex % EXAMPLES.length];
            exampleIndex++;
        });

        // Start the loop
        setInterval(fetchAlerts, 2000);
        fetchAlerts(); // Initial call
    </script>
</body>
</html>
